<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <style>
    .f{font-family:'Play','Trebuchet MS','Segoe UI',system-ui,sans-serif}
    .sh{filter:drop-shadow(2px 2px 4px rgba(0,0,0,.8))}
    @keyframes shieldPulse{0%,100%{opacity:0}50%{opacity:.4}}
    .sGlow{animation:shieldPulse 3s ease-in-out infinite}
  </style>

  <rect width="1920" height="1080" rx="24" fill="#0d1117"/>

  <!-- requested task flows through -->
  <g>
    <rect x="120" y="450" width="480" height="180" rx="16" fill="rgba(0,255,16,0.10)" stroke="#00FF10" stroke-width="4"/>
    <text class="f sh" x="360" y="520" font-size="36" letter-spacing="3" fill="#00FF10" text-anchor="middle" dominant-baseline="central">THE REQUESTED TASK</text>
    <rect x="190" y="566" width="340" height="10" rx="5" fill="rgba(0,255,16,0.45)"/>
  </g>
  <line x1="600" y1="540" x2="850" y2="540" stroke="#00FF10" stroke-width="5"/>
  <path d="M 836 526 L 850 540 L 836 554" fill="none" stroke="#00FF10" stroke-width="5"/>
  <line x1="1070" y1="540" x2="1420" y2="540" stroke="#00FF10" stroke-width="5"/>
  <path d="M 1406 526 L 1420 540 L 1406 554" fill="none" stroke="#00FF10" stroke-width="5"/>

  <!-- delivered -->
  <g>
    <circle cx="1540" cy="540" r="70" fill="none" stroke="#00FF10" stroke-width="6"/>
    <path d="M 1505 542 L 1530 568 L 1578 508" fill="none" stroke="#00FF10" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="f sh" x="1540" y="672" font-size="32" letter-spacing="3" fill="rgba(255,255,255,0.7)" text-anchor="middle" dominant-baseline="central">DELIVERED</text>
  </g>

  <!-- shield -->
  <path class="sGlow" d="M 960 320 L 1092 372 V 568 Q 1092 700 960 762 Q 828 700 828 568 V 372 Z" fill="none" stroke="#FFB020" stroke-width="3"/>
  <path d="M 960 340 L 1075 386 V 566 Q 1075 686 960 742 Q 845 686 845 566 V 386 Z" fill="rgba(8,12,18,0.9)" stroke="#FFB020" stroke-width="6"/>
  <!-- lock -->
  <rect x="922" y="530" width="76" height="62" rx="10" fill="none" stroke="#FFB020" stroke-width="6"/>
  <path d="M 936 530 V 502 Q 936 474 960 474 Q 984 474 984 502 V 530" fill="none" stroke="#FFB020" stroke-width="6"/>
  <circle cx="960" cy="560" r="7" fill="#FFB020"/>
  <text class="f sh" x="960" y="810" font-size="30" letter-spacing="4" fill="#FFB020" text-anchor="middle" dominant-baseline="central">SCOPE</text>

  <!-- rejected extras bounce off -->
  <g class="f sh" font-size="30" letter-spacing="2">
    <g>
      <rect x="330" y="150" width="330" height="70" rx="35" fill="rgba(239,68,68,0.10)" stroke="#EF4444" stroke-width="4"/>
      <text x="495" y="185" fill="#EF4444" text-anchor="middle" dominant-baseline="central">SCOPE CREEP</text>
      <line x1="660" y1="185" x2="880" y2="330" stroke="#EF4444" stroke-width="4" stroke-dasharray="14 12"/>
      <path d="M 868 310 L 896 342 M 896 314 L 866 340" stroke="#EF4444" stroke-width="6" fill="none" stroke-linecap="round"/>
    </g>
    <g>
      <rect x="1250" y="150" width="400" height="70" rx="35" fill="rgba(239,68,68,0.10)" stroke="#EF4444" stroke-width="4"/>
      <text x="1450" y="185" fill="#EF4444" text-anchor="middle" dominant-baseline="central">CO-AUTHOR CREDIT</text>
      <line x1="1250" y1="185" x2="1040" y2="330" stroke="#EF4444" stroke-width="4" stroke-dasharray="14 12"/>
      <path d="M 1052 310 L 1024 342 M 1024 314 L 1054 340" stroke="#EF4444" stroke-width="6" fill="none" stroke-linecap="round"/>
    </g>
    <g>
      <rect x="240" y="850" width="430" height="70" rx="35" fill="rgba(239,68,68,0.10)" stroke="#EF4444" stroke-width="4"/>
      <text x="455" y="885" fill="#EF4444" text-anchor="middle" dominant-baseline="central">UNASKED REFACTOR</text>
      <line x1="670" y1="885" x2="855" y2="710" stroke="#EF4444" stroke-width="4" stroke-dasharray="14 12"/>
      <path d="M 845 690 L 873 722 M 873 694 L 843 720" stroke="#EF4444" stroke-width="6" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- caption -->
  <text class="f" x="960" y="1000" font-size="30" letter-spacing="3" fill="rgba(255,255,255,0.5)" text-anchor="middle" dominant-baseline="central">DELIVER ONLY WHAT WAS REQUESTED, AT THE INTENDED SCOPE</text>
</svg>
