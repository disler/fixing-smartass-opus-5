<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <style>
    .f{font-family:'Play','Trebuchet MS','Segoe UI',system-ui,sans-serif}
    .m{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace}
    .sh{filter:drop-shadow(2px 2px 4px rgba(0,0,0,.8))}
    @keyframes edgePulse{0%,100%{opacity:.45}50%{opacity:1}}
    .edge{stroke:#00F3FF;stroke-width:4;fill:none;animation:edgePulse 3s ease-in-out infinite}
    .e2{animation-delay:.375s}.e3{animation-delay:.75s}.e4{animation-delay:1.125s}
    @keyframes fileGlow{0%,100%{opacity:0}50%{opacity:.35}}
    .glow{animation:fileGlow 3s ease-in-out infinite}
  </style>

  <rect width="1920" height="1080" rx="24" fill="#0d1117"/>

  <!-- system prompt file -->
  <rect class="glow" x="629" y="119" width="662" height="222" rx="26" fill="none" stroke="#00F3FF" stroke-width="3"/>
  <rect x="640" y="130" width="640" height="200" rx="18" fill="rgba(8,12,18,0.78)" stroke="#00F3FF" stroke-width="5"/>
  <text class="m sh" x="960" y="196" font-size="36" fill="#00F3FF" text-anchor="middle" dominant-baseline="central">sr_opus_5_system_prompt.md</text>
  <rect x="710" y="242" width="500" height="10" rx="5" fill="rgba(255,255,255,0.30)"/>
  <rect x="710" y="272" width="380" height="10" rx="5" fill="rgba(255,255,255,0.30)"/>

  <!-- edges from file to the four sections -->
  <path class="edge"    d="M 960 341 V 440 H 330 V 630"/>
  <path class="edge e2" d="M 960 341 V 440 H 750 V 630"/>
  <path class="edge e3" d="M 960 341 V 440 H 1170 V 630"/>
  <path class="edge e4" d="M 960 341 V 440 H 1590 V 630"/>

  <!-- section cards -->
  <g>
    <rect x="150" y="640" width="360" height="220" rx="16" fill="rgba(8,12,18,0.78)" stroke="rgba(255,255,255,0.20)" stroke-width="3"/>
    <circle cx="210" cy="700" r="26" fill="#00FF10"/>
    <text class="f" x="210" y="700" font-size="34" font-weight="700" fill="#0A0E14" text-anchor="middle" dominant-baseline="central">1</text>
    <text class="f sh" x="330" y="770" font-size="38" letter-spacing="2" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">PATTERNS</text>
    <text class="f" x="330" y="820" font-size="26" fill="rgba(255,255,255,0.55)" text-anchor="middle" dominant-baseline="central">do this &#183; never that</text>
  </g>
  <g>
    <rect x="570" y="640" width="360" height="220" rx="16" fill="rgba(8,12,18,0.78)" stroke="rgba(255,255,255,0.20)" stroke-width="3"/>
    <circle cx="630" cy="700" r="26" fill="#00F3FF"/>
    <text class="f" x="630" y="700" font-size="34" font-weight="700" fill="#0A0E14" text-anchor="middle" dominant-baseline="central">2</text>
    <text class="f sh" x="750" y="770" font-size="38" letter-spacing="2" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">REFERENCES</text>
    <text class="m" x="750" y="820" font-size="26" fill="rgba(255,255,255,0.55)" text-anchor="middle" dominant-baseline="central">D1 &#183; O1 &#183; Q1</text>
  </g>
  <g>
    <rect x="990" y="640" width="360" height="220" rx="16" fill="rgba(8,12,18,0.78)" stroke="rgba(255,255,255,0.20)" stroke-width="3"/>
    <circle cx="1050" cy="700" r="26" fill="#FFB020"/>
    <text class="f" x="1050" y="700" font-size="34" font-weight="700" fill="#0A0E14" text-anchor="middle" dominant-baseline="central">3</text>
    <text class="f sh" x="1170" y="770" font-size="38" letter-spacing="2" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">BOUNDARIES</text>
    <text class="f" x="1170" y="820" font-size="26" fill="rgba(255,255,255,0.55)" text-anchor="middle" dominant-baseline="central">only what was asked</text>
  </g>
  <g>
    <rect x="1410" y="640" width="360" height="220" rx="16" fill="rgba(8,12,18,0.78)" stroke="rgba(255,255,255,0.20)" stroke-width="3"/>
    <circle cx="1470" cy="700" r="26" fill="#E5683C"/>
    <text class="f" x="1470" y="700" font-size="34" font-weight="700" fill="#0A0E14" text-anchor="middle" dominant-baseline="central">4</text>
    <text class="f sh" x="1590" y="770" font-size="38" letter-spacing="2" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">ALIASES</text>
    <text class="m" x="1590" y="820" font-size="26" fill="rgba(255,255,255,0.55)" text-anchor="middle" dominant-baseline="central">scr &#183; eli &#183; foc &#183; ref</text>
  </g>

  <!-- caption -->
  <text class="f" x="960" y="960" font-size="30" letter-spacing="3" fill="rgba(255,255,255,0.5)" text-anchor="middle" dominant-baseline="central">ONE FILE, APPLIED TO EVERY PROMPT</text>
</svg>
